<!doctype html>
<html lang="en">
<head>
<!-- @shell:head -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report a life change — Seedlings</title>
<link rel="icon" href="../assets/seedlings-mark-light.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<!-- @/shell:head -->
</head>
<body data-page="life-change" data-shell="app">
<a class="skip-link" href="#main">Skip to content</a>
<!-- @shell:topbar -->
<header class="appbar">
  <div class="container appbar__inner">
    <a class="brand" href="./dashboard.html"><img class="brand__logo" src="../assets/seedlings-logo-horizontal-light.svg" alt="Seedlings home"></a>
    <a class="avatar" href="./settings.html" aria-label="Your profile, Jordan Lee">JL</a>
  </div>
</header>
<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" href="./dashboard.html"><img class="brand__logo" src="../assets/seedlings-logo-horizontal-light.svg" alt="Seedlings home"></a>
    <nav class="topbar__nav" aria-label="Primary">
      <a class="topbar__link" data-nav="home" href="./dashboard.html" aria-current="page">Home</a>
      <a class="topbar__link" data-nav="settings" href="./settings.html">Settings</a>
    </nav>
    <div class="topbar__actions">
      <a class="btn btn--quiet btn--s" href="./settings.html#help"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg>Help</a>
      <a class="avatar" href="./settings.html" aria-label="Your profile, Jordan Lee">JL</a>
    </div>
  </div>
</header>
<!-- @/shell:topbar -->
<main class="app-main container" id="main">
  <div class="narrow">
  <a class="back-link" href="./dashboard.html"><svg class="icon icon--s" aria-hidden="true"><use href="#i-arrow_left"/></svg>Home</a>
  <h1 class="page-header__title">What changed?</h1>
  <p class="page-header__subtitle">Some changes affect the grants. We’ll update your RESP provider and the government for you.</p>
  <fieldset class="mt-xl">
    <legend class="visually-hidden">Type of change</legend>
    <div class="choices">
        <label class="choice"><input class="choice__control" type="radio" name="change" value="address" checked><span class="choice__icon"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg></span><span class="choice__body"><span class="choice__title">We moved</span><span class="choice__desc">New home address.</span></span></label>
        <label class="choice"><input class="choice__control" type="radio" name="change" value="child"><span class="choice__icon"><svg class="icon" aria-hidden="true"><use href="#i-child"/></svg></span><span class="choice__body"><span class="choice__title">New child in the family</span><span class="choice__desc">Birth, adoption or a child came to live with you.</span></span></label>
        <label class="choice"><input class="choice__control" type="radio" name="change" value="custody"><span class="choice__icon"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg></span><span class="choice__body"><span class="choice__title">Custody changed</span><span class="choice__desc">Who a child lives with most of the time.</span></span></label>
        <label class="choice"><input class="choice__control" type="radio" name="change" value="income"><span class="choice__icon"><svg class="icon" aria-hidden="true"><use href="#i-dollar"/></svg></span><span class="choice__body"><span class="choice__title">Our income changed a lot</span><span class="choice__desc">It can change what the bond pays each year.</span></span></label>
    </div>
  </fieldset>
  <div class="card card--sand mt-l"><p class="reason__title">Next: your new address</p><p class="reason__text">About 2 minutes. You’ll check what we send to Northfield before it goes.</p></div>
  <div class="actions"><a class="btn btn--primary" href="./intake.parent-address.html">Continue<svg class="icon" aria-hidden="true"><use href="#i-arrow_right"/></svg></a></div>
  </div>
</main>
<!-- @shell:bottomnav -->
<nav class="bottom-nav" aria-label="Primary">
  <a class="bottom-nav__item" data-nav="home" href="./dashboard.html" aria-current="page"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span>Home</a>
  <a class="bottom-nav__item" data-nav="settings" href="./settings.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></span>Settings</a>
</nav>
<!-- @/shell:bottomnav -->
<script src="../app.js"></script>
</body>
</html>
